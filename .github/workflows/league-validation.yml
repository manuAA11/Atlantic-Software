name: Atlantic League isolated validation
on:
  workflow_dispatch:
  push:
    branches: [pruebas, main]
    paths: ['league/**', 'common/league_*.py', 'common/training_*.py', 'training/**', '.github/workflows/league-validation.yml']
  pull_request:
    branches: [main]
    paths: ['league/**', 'common/league_*.py', 'common/training_*.py', 'training/**', '.github/workflows/league-validation.yml']
permissions:
  contents: read
concurrency:
  group: league-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: league
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: league/package-lock.json
      - run: npm ci
      - name: Install pinned dependencies of the existing Gym schema fixtures
        run: |
          npm ci --prefix ../GymSoft_Comercial_3.6.0 --ignore-scripts --no-audit --no-fund
          npm ci --prefix ../GymSoft_ZTATTUZ_3.6.1_x86 --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Actual PostgreSQL race for the final slot
        env:
          LEAGUE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          set -o pipefail
          npm run test:postgres | tee postgres-evidence.json
          npm run test:training:postgres | tee training-postgres-evidence.json
      - name: Bundle iOS and Android JavaScript
        run: npm exec --workspace @atlantic/league-mobile -- expo export --platform ios --platform android --output-dir dist-native
      - name: Browser checks of the shared phone UI with simulated data
        run: |
          npm run build:pwa
          npx playwright install --with-deps chromium
          npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: league-isolated-validation
          path: |
            league/postgres-evidence.json
            league/training-postgres-evidence.json
            league/.qa/browser-report/
            league/.qa/browser-results/
