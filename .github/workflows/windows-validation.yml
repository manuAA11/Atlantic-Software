name: Multi-Gym Windows validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-validation.yml'
      - 'GymSoft_*/**'
      - 'common/**'
      - 'backend/**'
      - 'tools/windows_frozen_probe.py'
      - 'tools/windows_packaging_qa.py'
      - 'tools/windows_installation_qa.py'
      - 'tools/backup_complete_sources.py'

permissions:
  contents: write

concurrency:
  group: windows-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.edition }} / Python ${{ matrix.python }} ${{ matrix.architecture }}
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: GymSoft_Comercial_3.6.0
            python: '3.14'
            architecture: x64
          - edition: GymSoft_ZTATTUZ_3.6.1_x64
            python: '3.14'
            architecture: x64
          - edition: GymSoft_ZTATTUZ_3.6.1_x86
            python: '3.14'
            architecture: x86
    env:
      GYMSOFT_OFFLINE_QA: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
    defaults:
      run:
        working-directory: ${{ matrix.edition }}
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare with the Windows batch file
        run: |
          cmd /d /c PREPARAR_PYTHON.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv\Scripts\python.exe -c "import sys,struct; print(sys.version); print('Bits:',struct.calcsize('P')*8)"
          exit $LASTEXITCODE
      - name: Install build dependencies and local database tests
        run: |
          & .\.venv\Scripts\python.exe -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /d /c PREPARAR_PRUEBAS.bat
          exit $LASTEXITCODE
      - name: Check portable packaging and installation guards
        working-directory: .
        run: |
          New-Item -ItemType Directory -Force "${{ matrix.edition }}/salida/validacion" | Out-Null
          & .\${{ matrix.edition }}\.venv\Scripts\python.exe -m unittest tools.test_windows_packaging_qa tools.test_backup_complete_sources tools.test_windows_installation_qa 2>&1 | Tee-Object -FilePath "${{ matrix.edition }}/salida/validacion/packaging-guards.log"
          exit $LASTEXITCODE
      - name: Prepare the desktop for medium and large window checks
        run: |
          New-Item -ItemType Directory -Force salida\validacion | Out-Null
          Start-Transcript -Path salida\validacion\display-setup.log
          try {
            & powershell.exe -NoProfile -NonInteractive -Command "Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & .\.venv\Scripts\python.exe -c "import tkinter as tk,json; from responsive_ui import enable_dpi_awareness,work_area; enable_dpi_awareness(); r=tk.Tk(); area=work_area(r); print('Test work area:',area); open('salida/validacion/display-windows.json','w').write(json.dumps({'work_area':area,'scope':'Actual Windows desktop geometry for UI tests'})); r.destroy(); assert area[2]>=1600 and area[3]>=1000, 'The Windows desktop cannot display the required large test windows.'"
            exit $LASTEXITCODE
          } finally {
            Stop-Transcript
          }
      - name: Freeze and run a Windows component probe
        run: |
          $sourceRoot = (Get-Location).Path
          $adminIcon = Join-Path $sourceRoot 'icono.ico'
          $receptionIcon = Join-Path $sourceRoot 'icono_recepcion.ico'
          & .\.venv\Scripts\python.exe -m PyInstaller --noconfirm --clean --onedir --console --name FrozenWindowsProbe --paths $sourceRoot --distpath salida/validacion/frozen-probe --workpath build/frozen-probe --specpath build/frozen-probe --icon $adminIcon --add-data "${adminIcon}:." --add-data "${receptionIcon}:." --hidden-import PIL._tkinter_finder --collect-all tzdata ..\tools\windows_frozen_probe.py 2>&1 | Tee-Object -FilePath salida\validacion\frozen-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv\Scripts\python.exe -c "from pathlib import Path; from build_windows import verify_executable_icon; verify_executable_icon(Path('salida/validacion/frozen-probe/FrozenWindowsProbe/FrozenWindowsProbe.exe'))" 2>&1 | Tee-Object -FilePath salida\validacion\frozen-build.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\salida\validacion\frozen-probe\FrozenWindowsProbe\FrozenWindowsProbe.exe --report salida/validacion/frozen-windows-components.json 2>&1 | Tee-Object -FilePath salida\validacion\frozen-execution.log
          exit $LASTEXITCODE
      - name: Restore the verified runtime incorporated in the application package
        run: |
          $bundleManifest = Get-Content -Raw (Join-Path $env:GITHUB_WORKSPACE 'backups/20261008/MANIFEST_APLICACIONES_COMPLETAS.json') | ConvertFrom-Json
          $product = if ('${{ matrix.edition }}' -eq 'GymSoft_Comercial_3.6.0') { 'AtlanticGym' } else { 'ZTATTUZ' }
          $bundleName = "${product}_APLICACION_COMPLETA_EN_DESARROLLO_20261008.zip"
          $bundle = $bundleManifest.packages | Where-Object { $_.file -eq $bundleName }
          if (-not $bundle) { throw 'The complete application package has no authenticated manifest entry.' }
          $archive = Join-Path $env:GITHUB_WORKSPACE "backups/20261008/$bundleName"
          & .\.venv\Scripts\python.exe ..\tools\backup_complete_sources.py --restore-runtime-from-package $archive --edition '${{ matrix.edition }}' --expected-sha256 $bundle.sha256
          exit $LASTEXITCODE
      - name: Compile and diagnose every real application and technical installer
        run: |
          & .\.venv\Scripts\python.exe ..\tools\windows_packaging_qa.py --installers
          exit $LASTEXITCODE
      - name: Install, update and uninstall on the disposable Windows runner
        run: |
          & .\.venv\Scripts\python.exe ..\tools\windows_installation_qa.py --ephemeral-runner 2>&1 | Tee-Object -FilePath salida\validacion\installation-entry.log
          exit $LASTEXITCODE
      - name: Recheck the failing dashboard layout first
        run: |
          & .\.venv\Scripts\python.exe tests/layout_consistency_ui_smoke.py 2>&1 | Tee-Object -FilePath salida\validacion\layout-preflight.log
          exit $LASTEXITCODE
      - name: Run the complete offline validation
        run: |
          & .\.venv\Scripts\python.exe run_validation.py
          exit $LASTEXITCODE
      - name: Check the final release remains blocked without acceptance
        run: |
          New-Item -ItemType Directory -Force salida\validacion | Out-Null
          & .\.venv\Scripts\python.exe build_windows.py 2>&1 | Out-File -Encoding utf8 salida\validacion\release-block.log
          $buildCode = $LASTEXITCODE
          $message = Get-Content -Raw salida\validacion\release-block.log
          if ($buildCode -eq 0 -or $message -notmatch 'Entrega bloqueada') {
            throw 'The unaccepted release did not stop at the acceptance gate.'
          }
          Write-Output 'Acceptance guard verified. No final installers produced by this workflow.'
          exit 0
      - name: Preserve diagnostic reports in a separate Git branch
        if: always()
        run: |
          $reportDir = Join-Path $env:GITHUB_WORKSPACE "evidence/windows-actions/${{ github.run_id }}/${{ matrix.edition }}"
          New-Item -ItemType Directory -Force $reportDir | Out-Null
          $validationDir = Join-Path $env:GITHUB_WORKSPACE "${{ matrix.edition }}/salida/validacion"
          if (Test-Path $validationDir) {
            Get-ChildItem $validationDir -Recurse -File | Where-Object { ($_.Extension -in '.json', '.log', '.txt') -and $_.FullName -notmatch '[\\/](dist|frozen-probe|cache-pyinstaller|build|instalacion)[\\/]' } | ForEach-Object {
              $relative = $_.FullName.Substring($validationDir.Length).TrimStart([char[]]'\/')
              $destination = Join-Path $reportDir $relative
              New-Item -ItemType Directory -Force (Split-Path -Parent $destination) | Out-Null
              Copy-Item $_.FullName -Destination $destination
            }
          }
          @{ run_id = '${{ github.run_id }}'; commit = '${{ github.sha }}'; edition = '${{ matrix.edition }}'; scope = 'Windows validation and technical packaging/installation only; no final release, real accounts or hardware acceptance.' } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $reportDir 'run.json')
          Push-Location $env:GITHUB_WORKSPACE
          try {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            $branch = "ci/windows-evidence/${{ github.run_id }}/${{ matrix.edition }}"
            git checkout -b $branch
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git add -f -- "evidence/windows-actions/${{ github.run_id }}/${{ matrix.edition }}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git commit -m "Preserve Windows QA reports for ${{ matrix.edition }} run ${{ github.run_id }}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin "HEAD:refs/heads/$branch"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
      - name: Save Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-evidence-${{ matrix.edition }}-python${{ matrix.python }}
          if-no-files-found: error
          path: evidence/windows-actions/${{ github.run_id }}/${{ matrix.edition }}/
