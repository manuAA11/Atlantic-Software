name: Multi-Gym Windows validation

on:
  workflow_dispatch:
    inputs:
      commercial_only:
        description: 'Validate Comercial only, including the separate owner download'
        type: boolean
        default: false
  push:
    branches: [main, pruebas]
    paths:
      - '.github/workflows/windows-validation.yml'
      - 'GymSoft_*/**'
      - 'common/**'
      - 'backend/**'
      - 'tools/windows_frozen_probe.py'
      - 'tools/windows_packaging_qa.py'
      - 'tools/windows_installation_qa.py'
      - 'tools/windows_configuration_delivery.py'
      - 'tools/test_*.py'
      - 'tools/platform_ui_smoke.py'
      - 'tools/login_ui_smoke.py'
      - 'tools/theme_ui_smoke.py'
      - 'tools/league_ui_smoke.py'
      - 'tools/training_ui_smoke.py'
      - 'training/**'
      - 'tools/update_notice_ui_smoke.py'
      - 'tools/publish_pilot_assets.py'
      - 'deployment/pilot_update.json'
      - 'tools/test_theme_settings.py'
      - 'supabase/migrations/**'
      - 'tools/test_backup_complete_sources.py'
      - 'tools/backup_complete_sources.py'

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.edition }} / Python ${{ matrix.python }} ${{ matrix.architecture }}
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.commercial_only && '[{"edition":"GymSoft_Comercial_3.6.0","python":"3.14","architecture":"x64"}]' || '[{"edition":"GymSoft_Comercial_3.6.0","python":"3.14","architecture":"x64"},{"edition":"GymSoft_ZTATTUZ_3.6.1_x64","python":"3.14","architecture":"x64"},{"edition":"GymSoft_ZTATTUZ_3.6.1_x86","python":"3.14","architecture":"x86"}]') }}
    env:
      GYMSOFT_OFFLINE_QA: '1'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
    defaults:
      run:
        working-directory: ${{ matrix.edition }}
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare with the Windows batch file
        run: |
          cmd /d /c PREPARAR_PYTHON.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv\Scripts\python.exe -c "import sys,struct; print(sys.version); print('Bits:',struct.calcsize('P')*8)"
          exit $LASTEXITCODE
      - name: Install build dependencies and local database tests
        run: |
          & .\.venv\Scripts\python.exe -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /d /c PREPARAR_PRUEBAS.bat
          exit $LASTEXITCODE
      - name: Check portable packaging and installation guards
        working-directory: .
        run: |
          New-Item -ItemType Directory -Force "${{ matrix.edition }}/salida/validacion" | Out-Null
          & .\${{ matrix.edition }}\.venv\Scripts\python.exe -m unittest tools.test_windows_packaging_qa tools.test_backup_complete_sources tools.test_windows_installation_qa tools.test_windows_configuration_delivery tools.test_shared_hardware tools.test_session_manager tools.test_session_sdk tools.test_realtime_session tools.test_session_identity tools.test_login_recovery tools.test_explicit_logout tools.test_relay_ports tools.test_core_client tools.test_updater tools.test_commercial_unification tools.test_official_baseline tools.test_interface_texts tools.test_theme_settings tools.test_publish_pilot_assets tools.test_league_client tools.test_training_models tools.test_appearance_location 2>&1 | Tee-Object -FilePath "${{ matrix.edition }}/salida/validacion/packaging-guards.log"
          exit $LASTEXITCODE
      - name: Prepare the desktop for medium and large window checks
        run: |
          New-Item -ItemType Directory -Force salida\validacion | Out-Null
          Start-Transcript -Path salida\validacion\display-setup.log
          try {
            & powershell.exe -NoProfile -NonInteractive -Command "Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & .\.venv\Scripts\python.exe -c "import tkinter as tk,json; from responsive_ui import enable_dpi_awareness,work_area; enable_dpi_awareness(); r=tk.Tk(); area=work_area(r); print('Test work area:',area); open('salida/validacion/display-windows.json','w').write(json.dumps({'work_area':area,'scope':'Actual Windows desktop geometry for UI tests'})); r.destroy(); assert area[2]>=1600 and area[3]>=1000, 'The Windows desktop cannot display the required large test windows.'"
            exit $LASTEXITCODE
          } finally {
            Stop-Transcript
          }
      - name: Validate Core targeting and shared platform UI
        run: |
          if ('${{ matrix.edition }}' -eq 'GymSoft_Comercial_3.6.0') {
            node ..\tools\test_core_sql.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & .\.venv\Scripts\python.exe ..\tools\login_ui_smoke.py 2>&1 | Tee-Object -FilePath salida\validacion\login-ui.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv\Scripts\python.exe ..\tools\logout_ui_smoke.py 2>&1 | Tee-Object -FilePath salida\validacion\logout-ui.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv\Scripts\python.exe ..\tools\platform_ui_smoke.py 2>&1 | Tee-Object -FilePath salida\validacion\platform-ui.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:ATLANTIC_TEST_EDITION = '${{ matrix.edition }}'
          & .\.venv\Scripts\python.exe ..\tools\theme_ui_smoke.py 2>&1 | Tee-Object -FilePath salida\validacion\appearance-ui.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv\Scripts\python.exe ..\tools\league_ui_smoke.py 2>&1 | Tee-Object -FilePath salida\validacion\league-catalog-ui.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv\Scripts\python.exe ..\tools\training_ui_smoke.py 2>&1 | Tee-Object -FilePath salida\validacion\training-ui.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv\Scripts\python.exe ..\tools\training_integrated_ui_smoke.py 2>&1 | Tee-Object -FilePath salida\validacion\training-integrated-ui.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv\Scripts\python.exe ..\tools\update_notice_ui_smoke.py 2>&1 | Tee-Object -FilePath salida\validacion\update-notice-ui.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          exit $LASTEXITCODE
      - name: Freeze and run a Windows component probe
        run: |
          $sourceRoot = (Get-Location).Path
          $adminIcon = Join-Path $sourceRoot 'icono.ico'
          $receptionIcon = Join-Path $sourceRoot 'icono_recepcion.ico'
          $sharedRoot = Split-Path $sourceRoot -Parent
          & .\.venv\Scripts\python.exe -m PyInstaller --noconfirm --clean --onedir --console --name FrozenWindowsProbe --paths $sourceRoot --paths $sharedRoot --distpath salida/validacion/frozen-probe --workpath build/frozen-probe --specpath build/frozen-probe --icon $adminIcon --add-data "${adminIcon}:." --add-data "${receptionIcon}:." --hidden-import PIL._tkinter_finder --collect-all tzdata ..\tools\windows_frozen_probe.py 2>&1 | Tee-Object -FilePath salida\validacion\frozen-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv\Scripts\python.exe -c "from pathlib import Path; from build_windows import verify_executable_icon; verify_executable_icon(Path('salida/validacion/frozen-probe/FrozenWindowsProbe/FrozenWindowsProbe.exe'))" 2>&1 | Tee-Object -FilePath salida\validacion\frozen-build.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probeOptions = @('--report', 'salida/validacion/frozen-windows-components.json')
          if ('${{ matrix.edition }}' -eq 'GymSoft_Comercial_3.6.0') { $probeOptions += '--owner-console' }
          & .\salida\validacion\frozen-probe\FrozenWindowsProbe\FrozenWindowsProbe.exe @probeOptions 2>&1 | Tee-Object -FilePath salida\validacion\frozen-execution.log
          exit $LASTEXITCODE
      - name: Restore the verified runtime incorporated in the application package
        run: |
          $bundleManifest = Get-Content -Raw (Join-Path $env:GITHUB_WORKSPACE 'backups/20261008/MANIFEST_APLICACIONES_COMPLETAS.json') | ConvertFrom-Json
          $product = if ('${{ matrix.edition }}' -eq 'GymSoft_Comercial_3.6.0') { 'AtlanticGym' } else { 'ZTATTUZ' }
          $bundleName = "${product}_APLICACION_COMPLETA_EN_DESARROLLO_20261008.zip"
          $bundle = $bundleManifest.packages | Where-Object { $_.file -eq $bundleName }
          if (-not $bundle) { throw 'The complete application package has no authenticated manifest entry.' }
          $archive = Join-Path $env:GITHUB_WORKSPACE "backups/20261008/$bundleName"
          & .\.venv\Scripts\python.exe ..\tools\backup_complete_sources.py --restore-runtime-from-package $archive --edition '${{ matrix.edition }}' --expected-sha256 $bundle.sha256
          exit $LASTEXITCODE
      - name: Create configuration installers with the actual Windows batch file
        run: |
          $env:GYMSOFT_BUILD_NONINTERACTIVE = '1'
          cmd /d /c CREAR_INSTALADORES.bat 2>&1 | Tee-Object -FilePath salida\validacion\crear-instaladores.log
          exit $LASTEXITCODE
      - name: Install, update and uninstall on the disposable Windows runner
        run: |
          & .\.venv\Scripts\python.exe ..\tools\windows_installation_qa.py --ephemeral-runner 2>&1 | Tee-Object -FilePath salida\validacion\installation-entry.log
          exit $LASTEXITCODE
      - name: Check the final release remains blocked without acceptance
        run: |
          New-Item -ItemType Directory -Force salida\validacion | Out-Null
          & .\.venv\Scripts\python.exe build_windows.py 2>&1 | Out-File -Encoding utf8 salida\validacion\release-block.log
          $buildCode = $LASTEXITCODE
          $message = Get-Content -Raw salida\validacion\release-block.log
          if ($buildCode -eq 0 -or $message -notmatch 'Entrega bloqueada') {
            throw 'The unaccepted release did not stop at the acceptance gate.'
          }
          Write-Output 'Acceptance guard verified. No final installers produced by this workflow.'
          exit 0
      - name: Package technical installers as validation artifacts
        run: |
          & .\.venv\Scripts\python.exe ..\tools\windows_configuration_delivery.py --output salida/PRUEBAS_DESCARGABLES
          exit $LASTEXITCODE
      - name: Save the complete customer installer download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NO_FINAL-client-download-${{ matrix.edition }}
          if-no-files-found: error
          path: ${{ matrix.edition }}/salida/PRUEBAS_DESCARGABLES/*.zip
      - name: Save Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-evidence-${{ matrix.edition }}-python${{ matrix.python }}
          if-no-files-found: error
          path: |
            ${{ matrix.edition }}/salida/validacion/**/*.json
            ${{ matrix.edition }}/salida/validacion/**/*.log
            ${{ matrix.edition }}/salida/validacion/**/*.txt
            !${{ matrix.edition }}/salida/validacion/**/frozen-probe/**
            !${{ matrix.edition }}/salida/validacion/**/instalacion/**
            !${{ matrix.edition }}/salida/validacion/**/build/**
            !${{ matrix.edition }}/salida/validacion/**/cache-pyinstaller/**
      - name: Save the separate owner installer for the repository operator
        if: success() && matrix.edition == 'GymSoft_Comercial_3.6.0'
        uses: actions/upload-artifact@v4
        with:
          name: NO_FINAL-PRIVADO_PROPIETARIO-Comercial-x64
          if-no-files-found: error
          path: ${{ matrix.edition }}/salida/PRUEBAS_PARA_CONFIGURAR/*/PRIVADO_PROPIETARIO/VALIDACION_NO_FINAL_GymSoft_Propietario_PRIVADO_*.exe
